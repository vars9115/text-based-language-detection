<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text-Based Language Detection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">
    <h1>🌐 Text-Based Language Detection</h1>

    <p>Enter text below to identify its language.</p>

    <form method="POST">
        <textarea
            name="text"
            placeholder="Enter your text here..."
            required>{{ text }}</textarea>

        <button type="submit">Detect Language</button>
    </form>

    {% if language %}
        <div class="result">
            <h2>Detected Language</h2>
            <p>{{ language }}</p>
        </div>
    {% endif %}

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}
</div>

</body>
</html>
